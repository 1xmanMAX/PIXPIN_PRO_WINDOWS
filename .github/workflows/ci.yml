name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Todo lo que vive en L0/L2 puro corre aqui: rapido y sin GPU. No cubre el
  # icono de bandeja real, el registro de atajos globales ni la escritura en
  # HKCU\...\Run: esos tests estan marcados #[ignore] porque necesitan una
  # sesion de escritorio interactiva (Shell_NotifyIconW lo atiende Explorer,
  # RegisterHotKey necesita una estacion de ventanas con entrada) que
  # windows-latest, al ser un runner hospedado sin sesion interactiva, no
  # ofrece de forma fiable. Esos tests se ejecutan a mano en una maquina de
  # desarrollo con `cargo test -- --ignored`; lo que si corre aqui es la
  # logica pura: parseo de atajos, resolucion de rutas, ida y vuelta de
  # ajustes TOML, Fluent, y la creacion/destruccion de la ventana
  # solo-mensajes (que si funciona sin sesion interactiva).
  #
  # Formato, Clippy y pruebas van en trabajos aparte (23-oct): con todo en
  # uno, un fallo de formato paraba antes de probar nada y no se sabia si
  # las pruebas pasaban.
  formato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formato
        run: cargo fmt --all --check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --test-threads=1 no es opcional: varios tests toman recursos globales
      # del sistema (el mutex de instancia unica, la clase de ventana, el icono
      # de bandeja) y compiten entre si en paralelo. Sin esto, CI fallaria de
      # forma intermitente, que es la peor manera de descubrirlo.
      - name: Tests
        # --no-fail-fast: un crate que falla no deja sin probar a los demas.
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

  # El nucleo que compartira la version de Mac, iPad e iPhone: formato,
  # sincronizar, lienzo, documentos y la logica de la interfaz. Corre en Linux
  # para demostrar que no depende de Windows (ver
  # docs/investigacion/2026-10-15-mac-ipad-iphone.md, fase 0). Si un crate de
  # esta lista gana una dependencia de Windows, el guardian lo para aqui
  # antes de que rompa el port.
  nucleo-portable:
    runs-on: ubuntu-latest
    env:
      PORTABLES: >-
        pixpin-geom pixpin-nivel pixpin-lecciones pixpin-sistema
        pixpin-motor2d pixpin-tinta pixpin-timeline pixpin-docs pixpin-hojas
        pixpin-office pixpin-sincro pdfsqueeze-core pixpin-ui pixpin-store
        pixpin-proyecto
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Guardian (ningun crate portable depende de Windows)
        shell: bash
        run: |
          mal=0
          for p in $PORTABLES; do
            if cargo tree -q -p "$p" -e normal --target x86_64-unknown-linux-gnu --prefix none \
                | grep -qE '^(windows|webview2)[a-z0-9_-]* v'; then
              echo "::error::$p depende de Windows y es parte del nucleo portable"
              mal=1
            fi
          done
          exit $mal
      - name: Tests del nucleo en Linux
        shell: bash
        run: cargo test $(printf -- '-p %s ' $PORTABLES) -- --test-threads=1

  # La copia del nucleo para la version de Apple (apple/nucleo, su propio
  # espacio de trabajo). En macOS, que es donde vivira.
  apple-nucleo:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apple
      - name: Tests del nucleo en macOS
        run: cargo test --workspace -- --test-threads=1

  licencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
