# TEMPORAL (24-oct-2026): las pruebas que solo fallan en el Windows de la CI
# (el OCR y el cierre de pixpin-notas), con toda su salida, para saber por
# que. Se quita en cuanto esten arregladas.
name: Diagnostico

on:
  push:
    branches: ['ccr-**']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Las zonas de la hoja (pixpin-ia)
        continue-on-error: true
        timeout-minutes: 15
        run: 'cargo test -p pixpin-ia --lib hoja:: -- --test-threads=1'
      - name: Notas, la de las tablas sola
        continue-on-error: true
        timeout-minutes: 5
        run: cargo test -p pixpin-notas --lib -- --exact editor::tablas::desplazar::pruebas::cambiar_el_tamano_de_la_ventana_recoloca_las_tablas --test-threads=1
      - name: Notas bajo el depurador (la pila del acceso invalido)
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          cargo test -p pixpin-notas --lib --no-run
          $exe = Get-ChildItem target\debug\deps\pixpin_notas-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
          if (-not $cdb) { Write-Host "sin cdb"; exit 0 }
          & $cdb.FullName -G -o -c "sxe -c `".echo ACCESO_INVALIDO; .lines -e; kn 60; .echo FIN_PILA; q`" av; g" $exe.FullName --test-threads=1
      - name: OCR del banco
        continue-on-error: true
        timeout-minutes: 25
        env:
          PIXPIN_DIAGRAMA_DEPURAR: '1'
        run: cargo test -p pixpin --bin pixpinmax el_parrafo_y_su_formula -- --nocapture
