# TEMPORAL (24-oct-2026): las pruebas que solo fallan en el Windows de la CI
# (el OCR y el cierre de pixpin-notas), con toda su salida, para saber por
# que. Se quita en cuanto esten arregladas.
name: Diagnostico

on:
  push:
    branches: ['ccr-**']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Notas, la de las tablas sola, con su salida
        continue-on-error: true
        run: cargo test -p pixpin-notas --lib -- --exact editor::tablas::desplazar::pruebas::cambiar_el_tamano_de_la_ventana_recoloca_las_tablas --test-threads=1 --nocapture
      - name: Notas, el arrastre y el asa juntas
        continue-on-error: true
        run: cargo test -p pixpin-notas --lib fotos::pruebas::el_a -- --test-threads=1
      - name: Notas, todas las de fotos
        continue-on-error: true
        run: cargo test -p pixpin-notas --lib fotos::pruebas -- --test-threads=1
      - name: Notas, todas menos el arrastre
        continue-on-error: true
        run: cargo test -p pixpin-notas --lib -- --test-threads=1 --skip el_arrastre_de_windows
      - name: Notas, todas menos el asa
        continue-on-error: true
        run: cargo test -p pixpin-notas --lib -- --test-threads=1 --skip el_asa_cambia_el_ancho
      - name: Las zonas de la hoja (pixpin-ia)
        continue-on-error: true
        run: 'cargo test -p pixpin-ia --lib hoja:: -- --test-threads=1'
      - name: OCR del banco
        continue-on-error: true
        env:
          PIXPIN_DIAGRAMA_DEPURAR: '1'
        run: cargo test -p pixpin --bin pixpinmax el_parrafo_y_su_formula -- --nocapture
