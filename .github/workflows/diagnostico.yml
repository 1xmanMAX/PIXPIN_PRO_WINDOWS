# TEMPORAL (24-oct-2026): las pruebas que solo fallan en el Windows de la CI
# (el OCR y el cierre de pixpin-notas), con toda su salida, para saber por
# que. Se quita en cuanto esten arregladas.
name: Diagnostico

on:
  push:
    branches: ['ccr-**']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Notas juntas, como en la CI
        continue-on-error: true
        timeout-minutes: 10
        run: cargo test -p pixpin-notas --lib -- --test-threads=1
      - name: OCR del banco
        continue-on-error: true
        timeout-minutes: 25
        env:
          PIXPIN_DIAGRAMA_DEPURAR: '1'
        run: cargo test -p pixpin --bin pixpinmax el_parrafo_y_su_formula -- --nocapture
