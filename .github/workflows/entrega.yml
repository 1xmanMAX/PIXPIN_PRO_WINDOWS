# La entrega para instalar: compila PinDesk en Windows (release) y deja un
# ZIP con los ejecutables y un «Instalar.cmd», como artefacto del trabajo y,
# si se pide, como version publicada en Releases. A mano (Actions → Entrega →
# Run workflow) o con una etiqueta `v*`.
name: Entrega

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta de la version (p. ej. v0.5.0). Vacio: solo el artefacto"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar (release)
        # pindesk-plantillas-app es PinDesk Plantillas (pindesk-plantillas.exe,
        # docs/plantillas.md): va en el mismo ZIP y no toca la app de siempre.
        run: cargo build --release -p pindesk -p pindesk-aligerar -p pindesk-lanzador -p pindesk-puente -p pindesk-mcp -p pindesk-plantillas-app
      - name: Empaquetar
        shell: pwsh
        run: |
          $dir = "PinDesk"
          New-Item -ItemType Directory $dir | Out-Null
          foreach ($exe in 'pindesk','pindesk-aligerar','pindesk-lanzador','pindesk-puente','pindesk-mcp','pindesk-plantillas') {
            Copy-Item "target\release\$exe.exe" $dir
          }
          # Instalar.cmd: copia todo a %LOCALAPPDATA%\Programs\PinDesk (el
          # mismo sitio fijo que herramientas\instalar.ps1, para que el
          # arranque con Windows apunte siempre a la ultima) y la abre.
          #
          # Y migra la instalacion de cuando se llamaba PixPin Max
          # (Programs\PixPinMax\pindesk.exe; docs/nombre-pindesk.md):
          # cierra los dos nombres (y los ayudantes, nuevos y viejos), pasa la
          # entrada de arranque «PixPinMax» a «PinDesk» (la app tambien lo
          # hace al abrirse), quita los .exe viejos de las dos carpetas (salvo
          # si hay un pindesk.toml: es una copia portable con datos) y
          # cambia el acceso del menu Inicio «PixPin Max» por «PinDesk». Los
          # datos de %APPDATA%\PixPinMax los pasa a %APPDATA%\PinDesk la
          # propia app al abrirse (docs/formato-pindesk.md).
          @'
          @echo off
          setlocal
          rem Abierto desde dentro del ZIP (Explorador, WinRAR, 7-Zip): solo
          rem este .cmd sale a una carpeta temporal y los .exe no estan a su
          rem lado. Entonces busca el ZIP mas reciente de PinDesk en Descargas,
          rem Escritorio o Documentos, lo descomprime en %TEMP% y sigue desde alli.
          if exist "%~dp0pindesk.exe" goto tengo
          echo Instalar.cmd se abrio desde dentro del ZIP. Buscando el ZIP para descomprimirlo...
          set "TMPPD=%TEMP%\PinDesk-instalar"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$c = @($env:USERPROFILE+'\Downloads', $env:USERPROFILE+'\Desktop', $env:USERPROFILE+'\Documents', $env:USERPROFILE+'\OneDrive\Escritorio', $env:USERPROFILE+'\OneDrive\Desktop', $env:USERPROFILE+'\OneDrive\Documentos') | Where-Object { Test-Path $_ }; $z = Get-ChildItem -Path $c -Filter 'PinDesk*.zip' -File -Recurse -Depth 2 -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1; if (-not $z) { exit 1 }; Remove-Item -Recurse -Force $env:TMPPD -ErrorAction SilentlyContinue; Expand-Archive -LiteralPath $z.FullName -DestinationPath $env:TMPPD -Force; Write-Host ('Usando ' + $z.FullName)"
          if errorlevel 1 goto sin_zip
          if not exist "%TMPPD%\pindesk.exe" goto sin_zip
          call "%TMPPD%\Instalar.cmd"
          exit /b
          :sin_zip
          echo.
          echo No encuentro pindesk.exe junto a Instalar.cmd.
          echo Descomprime primero el ZIP: clic derecho en el ZIP ^> Extraer todo,
          echo y abre Instalar.cmd desde la carpeta descomprimida.
          pause
          exit /b 1
          :tengo
          set "DEST=%LOCALAPPDATA%\Programs\PinDesk"
          set "VIEJO=%LOCALAPPDATA%\Programs\PixPinMax"
          set "RUN=HKCU\Software\Microsoft\Windows\CurrentVersion\Run"
          set "INICIO=%APPDATA%\Microsoft\Windows\Start Menu\Programs"
          for %%e in (pindesk pixpinmax pindesk-aligerar pixpin-aligerar pindesk-lanzador pixpin-lanzador pindesk-puente pixpin-puente pindesk-plantillas) do (
            taskkill /im %%e.exe /f >nul 2>&1
          )
          if not exist "%DEST%" mkdir "%DEST%"
          copy /y "%~dp0*.exe" "%DEST%\" >nul
          if exist "%DEST%\pindesk.exe" goto copiado
          echo.
          echo No se pudo copiar PinDesk a %DEST%.
          echo Cierra PinDesk si sigue abierto y vuelve a ejecutar Instalar.cmd.
          pause
          exit /b 1
          :copiado
          for %%e in (pixpin-aligerar pixpin-lanzador pixpin-puente) do (
            if exist "%DEST%\%%e.exe" del /f /q "%DEST%\%%e.exe" >nul 2>&1
          )
          rem pixpin-mcp.exe: si la configuracion de Claude aun lo nombra, se
          rem queda como copia de pindesk-mcp.exe (para no romperla); si no, fuera.
          if not exist "%DEST%\pixpin-mcp.exe" goto mcp_hecho
          findstr /m /c:"pixpin-mcp" "%APPDATA%\Claude\claude_desktop_config.json" "%USERPROFILE%\.claude.json" >nul 2>&1
          if errorlevel 1 (
            del /f /q "%DEST%\pixpin-mcp.exe" >nul 2>&1
          ) else (
            copy /y "%~dp0pindesk-mcp.exe" "%DEST%\pixpin-mcp.exe" >nul
            echo Tu configuracion de Claude usa pixpin-mcp.exe: cambiala a pindesk-mcp.exe ^(docs\integraciones-mcp.md^).
          )
          :mcp_hecho
          reg query "%RUN%" /v PixPinMax >nul 2>&1
          if not errorlevel 1 (
            reg add "%RUN%" /v PinDesk /t REG_SZ /d "\"%DEST%\pindesk.exe\"" /f >nul
            reg delete "%RUN%" /v PixPinMax /f >nul
          )
          if exist "%VIEJO%\pixpinmax.toml" goto acceso
          for %%e in (pixpinmax pixpin-aligerar pixpin-lanzador pixpin-puente pixpin-mcp) do (
            if exist "%VIEJO%\%%e.exe" del /f /q "%VIEJO%\%%e.exe" >nul 2>&1
          )
          :acceso
          if exist "%INICIO%\PixPin Max.lnk" del /f /q "%INICIO%\PixPin Max.lnk" >nul 2>&1
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$s = (New-Object -ComObject WScript.Shell).CreateShortcut($env:INICIO + '\PinDesk.lnk'); $s.TargetPath = $env:DEST + '\pindesk.exe'; $s.WorkingDirectory = $env:DEST; $s.IconLocation = $env:DEST + '\pindesk.exe,0'; $s.Description = 'PinDesk: capturas, pines, chat y lienzo'; $s.Save()" >nul 2>&1
          rem PinDesk Plantillas (nombre provisional, el de nucleo::NOMBRE_PRODUCTO).
          if exist "%DEST%\pindesk-plantillas.exe" powershell -NoProfile -ExecutionPolicy Bypass -Command "$s = (New-Object -ComObject WScript.Shell).CreateShortcut($env:INICIO + '\PinDesk Plantillas.lnk'); $s.TargetPath = $env:DEST + '\pindesk-plantillas.exe'; $s.WorkingDirectory = $env:DEST; $s.IconLocation = $env:DEST + '\pindesk-plantillas.exe,0'; $s.Description = 'PinDesk Plantillas: diarios, planificadores y calendarios por bloques'; $s.Save()" >nul 2>&1
          start "" "%DEST%\pindesk.exe"
          echo PinDesk instalado en %DEST%
          '@ | Set-Content -Encoding ascii "$dir\Instalar.cmd"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $zip = "PinDesk-windows-x64-$sha.zip"
          Compress-Archive -Path "$dir\*" -DestinationPath $zip
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: PinDesk-windows-x64
          path: ${{ env.ZIP }}
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          gh release create $tag $env:ZIP --target "${{ github.sha }}" --title "PinDesk $tag" --notes "Descomprime el ZIP y ejecuta Instalar.cmd (o pindesk.exe directamente). Si tenias PixPin Max, Instalar.cmd la sustituye y conserva tus datos."
