[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# La version de Apple tiene su propio espacio de trabajo (apple/Cargo.toml).
exclude = ["apple"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Max Anthony Mamani Maquera"]
repository = "https://github.com/1xmanMAX/pixpin-max"

[workspace.dependencies]
# Internas
pixpin-geom = { path = "crates/pixpin-geom" }
pixpin-nivel = { path = "crates/pixpin-nivel" }
pixpin-shell = { path = "crates/pixpin-shell" }
pixpin-motor2d = { path = "crates/pixpin-motor2d" }
pixpin-tinta = { path = "crates/pixpin-tinta" }
pixpin-render = { path = "crates/pixpin-render" }
pixpin-codec = { path = "crates/pixpin-codec" }
# Oir y grabar notas de voz: Media Foundation para reproducir, WASAPI para
# el microfono. Sin dependencias de PixPin: vive con los cimientos.
pixpin-audio = { path = "crates/pixpin-audio" }
# El motor de grabar: WASAPI para el microfono y el sonido del equipo, la
# deriva de los relojes, la mezcla y el `.m4a`. Cimiento, sin depender de
# ningun crate de PixPin (ver docs/motor-de-audio.md).
pixpin-motor-audio = { path = "crates/pixpin-motor-audio" }
# Pasar una nota de voz a texto y el telepronter. Cimiento como
# `pixpin-audio`: Media Foundation para decodificar y Vosk cargado al vuelo,
# sin depender de ningun crate de PixPin.
pixpin-voz = { path = "crates/pixpin-voz" }
# El asistente local (modelo de lenguaje pequeno, sin red) y sus herramientas.
# Ver docs/investigacion/2026-10-13-ia-local.md.
pixpin-ia = { path = "crates/pixpin-ia" }
pixpin-capture = { path = "crates/pixpin-capture" }
pixpin-pin = { path = "crates/pixpin-pin" }
# La pila de capturas: el icono de la esquina que junta varias capturas
# seguidas para pegarlas todas de un Ctrl+V. Capa L2 como el pin, y por eso
# tampoco puede ver pixpin-store: los ajustes le llegan ya masticados.
pixpin-pila = { path = "crates/pixpin-pila" }
pixpin-pdf = { path = "crates/pixpin-pdf" }
# Word, libros y paginas leidos dentro (visor de documentos, tanda 2.1).
pixpin-docs = { path = "crates/pixpin-docs" }
pixpin-hojas = { path = "crates/pixpin-hojas" }
pixpin-office = { path = "crates/pixpin-office" }
pixpin-ocr = { path = "crates/pixpin-ocr" }
pixpin-record = { path = "crates/pixpin-record" }
# El motor de video (captura por la GPU, codificador de la grafica, MP4 con
# el sonido que le den). Ver docs/motor-de-video.md.
pixpin-motor-video = { path = "crates/pixpin-motor-video" }
pixpin-store = { path = "crates/pixpin-store" }
# El visor de HTML empotrado (WebView2): abrir dentro de PixPin un .html del
# chat y dejar que su propio boton de guardar sobrescriba el fichero. Cimiento
# como pixpin-audio: solo WebView2 y geometria, sin ver ningun otro crate.
pixpin-web = { path = "crates/pixpin-web" }
pixpin-ui = { path = "crates/pixpin-ui" }
# El compresor de PDF del autor (github.com/1xmanMAX/Thesis), copiado: el
# repositorio es privado y una dependencia git no compilaria sin credenciales.
# Ver crates/pdfsqueeze-core/PROCEDENCIA.md.
pdfsqueeze-core = { path = "crates/pdfsqueeze-core" }
pixpin-aligerar = { path = "apps/pixpin-aligerar" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# La criptografia y el gzip de sincronizar, optimizados tambien sin
# `--release`: sin optimizar, cifrar un chat de un par de megas tarda decenas
# de segundos y las pruebas de sincronizar de verdad se eternizan. Solo estos
# paquetes: el resto se sigue compilando como siempre.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
# Y el propio cable: sincronizar un chat de cientos de mensajes recorre su
# JSON decenas de veces (resumenes, copias, inventarios en los dos lados).
[profile.dev.package.pixpin-sincro]
opt-level = 2
# Aligerar un PDF: sin optimizar, pdfsqueeze tarda minutos en lo que en
# release son segundos (zopfli y las carreras de JPEG), y las pruebas que
# comprimen de verdad se eternizarian.
[profile.dev.package.pdfsqueeze-core]
opt-level = 3
# pdfsqueeze cuenta con la aritmetica del release, que da la vuelta sin
# avisar (la imagen integral de mrc.rs resta u32 que se envuelven a
# proposito, y sus pruebas multiplican u8 que desbordan). Con las
# comprobaciones de depuracion encendidas cuatro de sus pruebas entran en
# panico; asi se prueba el mismo codigo que se compila en el ejecutable.
overflow-checks = false
debug-assertions = false
[profile.dev.package.zopfli]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.jpeg-decoder]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
# Las hojas de un PDF como imagen en la pagina web van en WebP sin perdida
# (Android v0.98.1): sin optimizar, cada hoja tarda segundos en las pruebas.
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.lopdf]
opt-level = 3
# El motor de formulas de las hojas: recalcular una hoja de 2 000 celdas tiene
# que bajar de 50 ms tambien en las pruebas (formula/pruebas_funciones.rs), y
# sin optimizar tardaba ~80 ms. El nivel 1 lo deja en ~15 ms; el resto del
# crate sigue igual de depurable.
[profile.dev.package.pixpin-proyecto]
opt-level = 1
# El puente del navegador (apps/pixpin-puente) tiene que contestar en menos
# de 50 ms y lo mide su prueba: sin optimizar, decodificar el base64 y el JSON
# de una captura de pagina de un mega tarda mas de 100 ms y la medida no
# diria nada del ejecutable de verdad.
[profile.dev.package.pixpin-puente]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
# El motor de audio: sus pruebas remuestrean diez minutos de sonido con el
# filtro de verdad (la deriva de los relojes solo se ve en tiradas largas), y
# sin optimizar tardarian minutos. Asi se prueba el mismo codigo que suena.
[profile.dev.package.pixpin-motor-audio]
opt-level = 3
