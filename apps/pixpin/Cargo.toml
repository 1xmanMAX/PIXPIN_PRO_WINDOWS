[package]
name = "pixpin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pixpinmax"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
pixpin-shell = { version = "0.1.0", path = "../../crates/pixpin-shell" }
pixpin-store = { version = "0.1.0", path = "../../crates/pixpin-store" }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
# Solo para MessageBoxW: el unico recurso que queda para avisar al usuario de
# un fallo de arranque cuando #![windows_subsystem = "windows"] no deja stderr
# y el registro a fichero puede no haberse podido abrir todavia.
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
toml = "0.8"

[build-dependencies]
embed-resource = "3.0.11"
