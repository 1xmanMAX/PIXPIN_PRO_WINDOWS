[package]
name = "pixpin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pixpinmax"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
fluent-bundle = "0.16.0"
pixpin-audio = { version = "0.1.0", path = "../../crates/pixpin-audio" }
pixpin-capture = { version = "0.1.0", path = "../../crates/pixpin-capture" }
pixpin-ocr = { version = "0.1.0", path = "../../crates/pixpin-ocr" }
# El asistente local del chat: motor llama.cpp aparte, herramientas y bucle.
pixpin-ia = { path = "../../crates/pixpin-ia" }
# Lo que se reconoce al escribir una tarea: el parser que comparten la app,
# el pedido `anadir_tarea` y el plugin de Flow Launcher.
pixpin-frase = { path = "../../crates/pixpin-frase" }
pixpin-docs = { version = "0.1.0", path = "../../crates/pixpin-docs" }
# El editor de notas Markdown (H12): el RichEdit de Windows, en su crate
# porque este ejecutable no admite `unsafe`.
pixpin-notas = { version = "0.1.0", path = "../../crates/pixpin-notas" }
pixpin-pdf = { version = "0.1.0", path = "../../crates/pixpin-pdf" }
# Word y PowerPoint maquetados como en Office (el pin de paginas de Office).
pixpin-office = { path = "../../crates/pixpin-office" }
pixpin-proyecto = { version = "0.1.0", path = "../../crates/pixpin-proyecto" }
pixpin-codec = { version = "0.1.0", path = "../../crates/pixpin-codec" }
pixpin-geom = { version = "0.1.0", path = "../../crates/pixpin-geom" }
pixpin-motor2d = { version = "0.1.0", path = "../../crates/pixpin-motor2d" }
pixpin-nivel = { version = "0.1.0", path = "../../crates/pixpin-nivel" }
pixpin-pin = { version = "0.1.0", path = "../../crates/pixpin-pin" }
pixpin-pila = { version = "0.1.0", path = "../../crates/pixpin-pila" }
pixpin-record = { version = "0.1.0", path = "../../crates/pixpin-record" }
pixpin-render = { version = "0.1.0", path = "../../crates/pixpin-render" }
pixpin-shell = { version = "0.1.0", path = "../../crates/pixpin-shell" }
pixpin-sincro = { version = "0.1.0", path = "../../crates/pixpin-sincro" }
# Lecciones aprendidas: la logica pura (ficha, repaso, buscador, etiquetas).
pixpin-lecciones = { path = "../../crates/pixpin-lecciones" }
pixpin-timeline = { path = "../../crates/pixpin-timeline" }
pixpin-store = { version = "0.1.0", path = "../../crates/pixpin-store" }
# Las hojas de Excel (.xlsx) en su visor como pin (`visor_hoja`).
pixpin-hojas = { path = "../../crates/pixpin-hojas" }
pixpin-tinta = { version = "0.1.0", path = "../../crates/pixpin-tinta" }
pixpin-ui = { version = "0.1.0", path = "../../crates/pixpin-ui" }
pixpin-cad = { path = "../../crates/pixpin-cad" }
pixpin-bim = { path = "../../crates/pixpin-bim" }
pixpin-web = { version = "0.1.0", path = "../../crates/pixpin-web" }
pixpin-voz = { version = "0.1.0", path = "../../crates/pixpin-voz" }
# Tarjetas de Anki de una clase, una foto o una nota (24-oct-2026).
pixpin-anki = { version = "0.1.0", path = "../../crates/pixpin-anki" }
# El borrador de las imagenes pegadas en Flow (`[img 01]` -> fichero): el
# mismo modulo que lee el plugin, asi el formato es uno solo. Solo serde y
# `windows`, que ya estan; el plugin no depende de nada de PixPin.
pixpin-lanzador = { version = "0.1.0", path = "../pixpin-lanzador" }
# La huella de los PDF ya aligerados (ver src/aligerar.rs). Ya esta en el
# arbol. pdfsqueeze NO va aqui: vive en su ejecutable, pixpin-aligerar.
sha2 = "0.10"
qrcodegen = "1.8.0"
# El dialogo de sincronizar viaja en JSON: mismas versiones que pixpin-sincro.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Comprimir el PDF de un plano exportado (`plano_cad::exportar`). Ya esta en el arbol.
flate2 = "1.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct3D11"] }

[dev-dependencies]
toml = "0.8"
# Las pruebas de aligerar fabrican un PDF cifrado; la misma que pdfsqueeze.
lopdf = { version = "0.42", default-features = false }
# El compresor en el propio hilo de las pruebas (no hay pixpin-aligerar.exe
# al lado del ejecutable de pruebas) y los PDF sinteticos de pdfsqueeze.
pixpin-aligerar = { workspace = true }
pdfsqueeze-core = { workspace = true }
# El «movil» de mentira de las pruebas de sincronizar (planos anotados que
# viajan, `plano_cad::anotar`) y sus dibujos comprimidos.
pixpin-sincro = { version = "0.1.0", path = "../../crates/pixpin-sincro", features = ["simulador"] }
# Ver el plano a PNG en el banco del asistente (`documentos_acciones`).
pixpin-cad = { path = "../../crates/pixpin-cad", features = ["pintar-png"] }
flate2 = "1.1"
# (Y la ventana de mentira que recibe los pedidos en `tests/orden_de_punta_a_punta.rs`.)
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_LibraryLoader"] }

[build-dependencies]
embed-resource = "3.0.11"
