<style>/* El editor de notas de PixPin, con la misma cara que el de antes
   (pixpin-notas: tema.rs, disposicion.rs, menu.rs, barra_flotante.rs):
   colores medidos del editor de documentos de Claude, Work Sans para el
   cuerpo y Fraunces para los titulos. */

:root {
  --papel: #0b0b0b;
  --cabecera: #20201f;
  --pastilla: #313130;
  --raya: #2a2a29;
  --texto: #e6e4df;
  --tenue: #9a9893;
  --apagado: #6e6d69;
  --menu: #20201f;
  --elegido: #414140;
  --boton-fondo: #f5f4ef;
  --boton-texto: #1a1a19;
  --tabla-cabecera: #151515;
  --tabla-raya: #2e2e2d;
  --fondo-codigo: #1d1d1c;
  --codigo: #e8c06a;
  --enlace: #8ab4f8;
  --acento: #5b9bf0;
  --hecha: #66bb6a;
  --formula: #c3a6ff;
  --barra-desliz: #4a4a48;
  --burbuja: #3e618a;
  --burbuja-texto: #fafafa;
  --burbuja-hora: #a8cce8;
  --letra-cuerpo: 'Work Sans', 'Segoe UI', sans-serif;
  --letra-titulos: 'Fraunces', Georgia, serif;
  --tam: 16px;
  --col: 720px;
}
@media (prefers-color-scheme: light) {
  :root {
    --papel: #fdfcf9;
    --cabecera: #f2f0ea;
    --pastilla: #e4e2da;
    --raya: #e2dfd6;
    --texto: #1f1e1d;
    --tenue: #6b6a66;
    --apagado: #a3a19b;
    --menu: #ffffff;
    --elegido: #ecebe4;
    --boton-fondo: #1f1e1d;
    --boton-texto: #faf9f5;
    --tabla-cabecera: #f2f0ea;
    --tabla-raya: #dcd9cf;
    --fondo-codigo: #f0eee8;
    --codigo: #9a5b13;
    --enlace: #1a62c9;
    --acento: #1e73d8;
    --hecha: #2e8b3a;
    --formula: #7447c7;
    --barra-desliz: #c4c4c0;
    --burbuja: #efffde;
    --burbuja-texto: #101b24;
    --burbuja-hora: #3f7a30;
  }
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--papel);
  color: var(--texto);
  font-family: var(--letra-cuerpo);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button {
  font: inherit;
  color: inherit;
}

/* ------------------------------------------------------------ cabecera */
.cabecera {
  position: fixed;
  inset: 0 0 auto 0;
  height: 44px;
  background: var(--cabecera);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 6px;
  z-index: 5;
}
.pastilla-titulo {
  display: flex;
  align-items: center;
  height: 28px;
  max-width: calc(100% - 300px);
  border-radius: 6px;
  background: var(--pastilla);
  border: 1px solid transparent;
  font-size: 13.5px;
  overflow: hidden;
}
.pastilla-titulo:hover {
  border-color: var(--apagado);
}
.pastilla-titulo .texto {
  padding: 0 4px 0 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: text;
  line-height: 28px;
}
.pastilla-titulo .flecha {
  width: 22px;
  height: 28px;
  display: grid;
  place-items: center;
  color: var(--tenue);
  cursor: pointer;
  flex: none;
}
.pastilla-titulo input {
  font: inherit;
  color: var(--texto);
  background: transparent;
  border: none;
  outline: none;
  padding: 0 10px;
  width: 320px;
  height: 28px;
}
.arrastre {
  flex: 1;
  align-self: stretch;
}
.b28 {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--tenue);
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  flex: none;
  padding: 0;
}
.b28:hover,
.b28.activo {
  background: var(--pastilla);
}
.b28 svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.b28.comentarios {
  color: var(--texto);
}
.b28.comentarios.activo {
  color: var(--acento);
}
.insignia {
  position: absolute;
  top: -3px;
  right: -3px;
  min-width: 15px;
  height: 15px;
  border-radius: 8px;
  background: var(--acento);
  color: #fff;
  font-size: 10px;
  line-height: 15px;
  text-align: center;
  padding: 0 3px;
}
.compartir {
  height: 28px;
  border-radius: 7px;
  border: none;
  background: var(--boton-fondo);
  color: var(--boton-texto);
  font-weight: 600;
  font-size: 13px;
  padding: 0 12px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  margin: 0 6px 0 0;
}
.compartir svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ventana-botones {
  display: flex;
  gap: 4px;
}

/* ------------------------------------------------------------ herramientas */
.herramientas {
  position: fixed;
  top: 44px;
  left: 0;
  right: 0;
  height: 38px;
  background: var(--papel);
  border-bottom: 1px solid var(--raya);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 10px;
  z-index: 4;
}
