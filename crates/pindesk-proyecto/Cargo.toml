[package]
name = "pindesk-proyecto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pindesk-motor2d = { version = "0.1.0", path = "../pindesk-motor2d" }
# Lo que se reconoce en el texto de una tarea (urgencia, #etiquetas, nota y
# recordatorio), para sacar las listas bien (`tareas_exportar`). Sin
# dependencias.
pindesk-frase = { version = "0.1.0", path = "../pindesk-frase" }
# El cable de sincronizar (capa 1): `vista` es su `Disco` sobre el almacen.
pindesk-sincro = { version = "0.1.0", path = "../pindesk-sincro" }
# Las uniones de directorio (enlaces simbolicos fuera de Windows): un
# proyecto guardado en la carpeta que elija el usuario (`ubicacion`), y la
# hora local. Capa 0, portable.
pindesk-sistema = { version = "0.1.0", path = "../pindesk-sistema" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Nombres de fichero siempre en NFC (`almacen::nombre_seguro`): el Mac los da
# en NFD y la sincronizacion compara rutas byte a byte.
unicode-normalization = "0.1.25"
# Solo `deflate`: un `.pixpin` no lleva cifrado ni formatos raros, y cada
# metodo de compresion de mas es codigo que hay que arrastrar sin usarlo.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# El «movil» de las pruebas de sincronizar: un Disco con la carpeta de
# Android, para hablar con el del PC por un socket de verdad.
pindesk-sincro = { version = "0.1.0", path = "../pindesk-sincro", features = ["simulador"] }
flate2 = "1.1"
# De quien es cada mensaje de un chat compartido (`conversacion::Lados`): las
# pruebas de las versiones vinculadas deciden «ajeno» con la regla de verdad.
pindesk-ui = { version = "0.1.0", path = "../pindesk-ui" }
