[package]
name = "pindesk-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fluent-bundle = "0.16.0"
pindesk-motor2d = { version = "0.1.0", path = "../pindesk-motor2d" }
# Atajos y entorno, portables: sin arrastrar Win32 (ver pindesk-sistema).
pindesk-sistema = { version = "0.1.0", path = "../pindesk-sistema" }
# Las palabras de fabrica de cada urgencia de las tareas (`[tareas]`).
pindesk-frase = { path = "../pindesk-frase" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
toml_edit = { version = "0.23", features = ["serde"] }
tracing = "0.1.44"
unic-langid = "0.9.6"

[dev-dependencies]
# Las variables de cada texto, para comprobar los catalogos traducidos.
fluent-syntax = "0.12.0"
