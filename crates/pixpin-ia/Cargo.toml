[package]
name = "pixpin-ia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror = "2.0.20"
tracing = "0.1.44"
# El protocolo con el modelo es JSON de punta a punta (peticiones al estilo
# OpenAI, llamadas a herramientas, elementos de Excalidraw para el lienzo).
serde_json = "1.0"
# La huella de cada fichero bajado (modelo y motor). Ya estaba en el arbol
# por pixpin-sincro y pdfsqueeze-core.
sha2 = "0.10.9"
# El motor (llama.cpp) llega en un .zip de su pagina de versiones; de el se
# sacan solo los ficheros que hacen falta. Mismo crate y rasgos que
# pixpin-docs, pixpin-hojas y pixpin-office.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# Bajar por HTTPS con WinHTTP (lo que ya trae Windows): se reutiliza el de la
# voz, que ya sigue redirecciones, escribe en `.parte` y se deja cancelar.
pixpin-voz = { path = "../pixpin-voz" }
# El proceso del modelo va dentro de un «trabajo» de Windows que lo mata si
# PixPin muere, y se lanza sin ventana.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    # Las claves de las API de la nube, cifradas con DPAPI (nube/claves.rs).
    "Win32_Security_Cryptography",
    # Hablar con Claude y DeepSeek por HTTPS con lo que ya trae Windows
    # (nube/http.rs), sin un cliente HTTP ni TLS propios en el ejecutable.
    "Win32_Networking_WinHttp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Las piezas que el lienzo ya sabe hacer (grafica de funciones, ecuacion
# compuesta, instrumento, tabla dibujada, biblioteca de figuras) se piden a
# su motor y se escriben con su escritor de Excalidraw: un solo componente.
# Es Rust puro (serde), sin ventanas.
pixpin-motor2d = { path = "../pixpin-motor2d" }
# Los tiradores del editor (`Tirador`), para escalar con la misma
# operacion que el raton (`edicion::hacer`). Sin dependencias.
pixpin-geom = { path = "../pixpin-geom" }
# Leer la ecuacion en LaTeX o a mano (`formulas::leer`, el de las notas, el
# mismo que el de Android): asi el lienzo entiende lo mismo que las notas.
pixpin-notas = { path = "../pixpin-notas" }
# Leer el SVG de las ilustraciones (`svg.rs`). Ya esta en el arbol por
# pixpin-bim; no carga DTD ni entidades (nada de bombas de XML).
roxmltree = "0.20"

[dev-dependencies]
# Solo en pruebas: pintar a PNG lo dibujado en el banco, por el mismo camino
# que el PDF (exportar -> PDF de vectores -> pixeles de Windows).
pixpin-pdf = { path = "../pixpin-pdf" }
pixpin-shell = { path = "../pixpin-shell" }
pixpin-codec = { path = "../pixpin-codec" }
# Solo en pruebas: leer las imagenes de muestra del banco y del calcado.
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
