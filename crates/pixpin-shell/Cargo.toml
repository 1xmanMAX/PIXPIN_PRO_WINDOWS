[package]
name = "pixpin-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pixpin-geom = { version = "0.1.0", path = "../pixpin-geom" }
pixpin-nivel = { version = "0.1.0", path = "../pixpin-nivel" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Globalization", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Graphics_Dxgi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11"] }

[dev-dependencies]
serde_json = "1.0.151"
