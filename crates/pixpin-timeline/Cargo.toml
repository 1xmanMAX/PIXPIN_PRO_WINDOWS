[package]
name = "pixpin-timeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# El timeline (5-oct-2026): los momentos del dia, minuto a minuto. Sin
# ventanas: el formato de cada momento, el fichero donde viven, partir lo
# dicho en titulo y descripcion, los dias del calendario y la pagina HTML
# que se exporta. Cimiento: solo serde y el disco, sin ningun crate de PixPin.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
